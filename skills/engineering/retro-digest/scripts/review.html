<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retro digest review</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #fff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e2e2e0;
    --accent: #2457d6; --apply: #1f7a3d; --reject: #b3261e; --open: #8a6d00;
    --take: #fff6dc; --take-line: #e8cf7a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, system-ui, "Segoe UI", sans-serif; }
  header { padding: 20px 24px 8px; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  h2 { font-size: 16px; margin: 28px 24px 8px; }
  .muted { color: var(--muted); }
  .legend, .toolbar { padding: 0 24px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  .toolbar { margin: 12px 0; }
  code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: #eeeeec; padding: 1px 4px; border-radius: 3px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .cards { padding: 0 24px; display: grid; gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 8px 20px; }
  .card[data-decision="apply"], .card[data-decision="reopen"] { border-left-color: var(--apply); }
  .card[data-decision="reject"] { border-left-color: var(--reject); }
  .card[data-decision="open"], .card[data-decision="fold"] { border-left-color: var(--open); }
  .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .id { font-weight: 700; }
  .title { font-weight: 600; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: #eeeeec; color: var(--muted); }
  .badge.global { background: #e3ebfd; color: var(--accent); }
  .score { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
  .members { font-size: 12px; color: var(--muted); word-break: break-word; }
  dl { margin: 6px 0 0; display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 2px 10px; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  .take { margin-top: 8px; background: var(--take); border: 1px solid var(--take-line); border-radius: 6px; padding: 6px 9px; }
  .take b { font-size: 12px; }
  .choices { display: flex; gap: 4px; align-self: start; }
  .choices label { flex: 1; text-align: center; border: 1px solid var(--line); border-radius: 6px; padding: 5px 0; cursor: pointer; user-select: none; }
  .choices input { display: none; }
  .choices label.rec::after { content: " ★"; color: var(--muted); font-size: 11px; }
  .choices input:checked + span { font-weight: 700; }
  .choices label:has(input[value=apply]:checked), .choices label:has(input[value=reopen]:checked) { background: #e4f3e8; border-color: var(--apply); color: var(--apply); }
  .choices label:has(input[value=reject]:checked) { background: #fbe6e4; border-color: var(--reject); color: var(--reject); }
  .choices label:has(input[value=open]:checked), .choices label:has(input[value=fold]:checked) { background: #fbf3d6; border-color: var(--open); color: var(--open); }
  footer { position: sticky; bottom: 0; margin-top: 28px; background: var(--panel); border-top: 1px solid var(--line); padding: 12px 24px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  #errors { color: var(--reject); margin: 0; padding-left: 18px; }
  #done { color: var(--apply); font-weight: 600; }
  .hidden { display: none !important; }
  @media (max-width: 760px) {
    header, .legend, .toolbar, .cards, footer { padding-left: 16px; padding-right: 16px; }
    h2 { margin-left: 16px; }
    .card { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">Retro digest review</h1>
  <div class="muted">Each row starts on Claude's recommendation (★); change what you disagree with. Grouping, tickets and reasons come afterwards in the chat. Your draft is kept in this browser.</div>
</header>
<div class="legend" id="legend"></div>

<h2>Clusters</h2>
<div class="toolbar">
  <label>Scope <select id="scope"><option value="">all</option><option>global</option><option>project</option></select></label>
  <label><input type="checkbox" id="changed"> Only where I differ from ★</label>
</div>
<div class="cards" id="clusters"></div>

<section id="recurring-section">
  <h2>Recurring after rejection</h2>
  <div class="cards" id="recurring"></div>
</section>

<footer>
  <button class="primary" id="download">Save review</button>
  <button id="copy">Copy for chat</button>
  <span id="progress" class="muted"></span>
  <span id="done"></span>
  <ul id="errors"></ul>
</footer>

<script>
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') { n.className = v; } else { n.setAttribute(k, v); }
  }
  for (const k of kids.flat()) {
    if (k != null) { n.append(k); }
  }
  return n;
};

let digest;
let storeKey;
let decisions = {};

function save() {
  try { localStorage.setItem(storeKey, JSON.stringify(decisions)); } catch {}
}

function load() {
  try { decisions = JSON.parse(localStorage.getItem(storeKey) ?? '{}') ?? {}; } catch {}
}

function choices(item, options) {
  return el('div', { class: 'choices' }, options.map((opt) => {
    const input = el('input', { type: 'radio', name: `d-${item.id}`, value: opt });
    input.checked = decisions[item.id] === opt;
    input.addEventListener('change', () => { decisions[item.id] = opt; save(); render(); });
    return el('label', { class: item.recommend === opt ? 'rec' : '' }, input, el('span', {}, opt));
  }));
}

function take(text) {
  return text ? el('div', { class: 'take' }, el('b', {}, "Claude's take: "), text) : null;
}

function clusterCard(c) {
  return el('div', { class: 'card', 'data-decision': decisions[c.id] ?? '' },
    el('div', {},
      el('div', { class: 'head' },
        el('span', { class: 'id' }, c.id),
        el('span', { class: 'title' }, c.title),
        el('span', { class: `badge ${c.scope}` }, c.scope),
        el('span', { class: 'badge' }, (c.projects ?? []).join(', ')),
        el('span', { class: 'score', title: 'occurrences × highest severity' }, String(c.score))),
      el('div', { class: 'members' }, c.members.join(' · ')),
      el('dl', {}, el('dt', {}, 'Target'), el('dd', {}, c.target), el('dt', {}, 'Proposal'), el('dd', {}, c.proposal)),
      take(c.observation)),
    choices(c, ['apply', 'reject', 'open']));
}

function recurringCard(r) {
  return el('div', { class: 'card', 'data-decision': decisions[r.id] ?? '' },
    el('div', {},
      el('div', { class: 'head' }, el('span', { class: 'id' }, r.id), el('span', { class: 'title' }, r.title)),
      el('div', { class: 'members' }, `Open: ${r.openMembers.join(' · ')}`),
      el('dl', {}, el('dt', {}, 'Rejected'), el('dd', {}, `${r.rejected}: ${r.reason}`)),
      take(r.observation)),
    choices(r, ['reopen', 'fold']));
}

function render() {
  const scope = document.getElementById('scope').value;
  const onlyChanged = document.getElementById('changed').checked;
  const shown = (x) => !onlyChanged || decisions[x.id] !== x.recommend;
  document.getElementById('clusters').replaceChildren(...digest.clusters
    .filter((c) => !scope || c.scope === scope)
    .filter(shown)
    .map(clusterCard));
  document.getElementById('recurring').replaceChildren(...(digest.recurring ?? []).filter(shown).map(recurringCard));
  const items = [...digest.clusters, ...(digest.recurring ?? [])];
  const decided = items.filter((x) => decisions[x.id]).length;
  const changed = items.filter((x) => decisions[x.id] && decisions[x.id] !== x.recommend).length;
  document.getElementById('progress').textContent = `${decided}/${items.length} decided, ${changed} differ from ★`;
}

/*VALIDATE*/

function reviewJson() {
  const errors = validateReview(digest, { decisions });
  document.getElementById('errors').replaceChildren(...errors.map((e) => el('li', {}, e)));
  return errors.length ? null : JSON.stringify({ decisions, savedAt: new Date().toISOString() }, null, 2);
}

function download() {
  const json = reviewJson();
  if (!json) { return; }
  const a = el('a', { href: URL.createObjectURL(new Blob([json], { type: 'application/json' })), download: digest.reviewFile });
  a.click();
  URL.revokeObjectURL(a.href);
  document.getElementById('done').textContent = `Saved as ${digest.reviewFile} in your downloads folder. Tell Claude you're done.`;
}

async function copy() {
  const json = reviewJson();
  if (!json) { return; }
  await navigator.clipboard.writeText(json);
  document.getElementById('done').textContent = 'Copied. Paste it into the chat.';
}

(() => {
  digest = /*DIGEST*/null;
  storeKey = `retro-digest-decisions:${digest.title}`;
  load();
  for (const x of [...digest.clusters, ...(digest.recurring ?? [])]) {
    if (x.recommend && !decisions[x.id]) {
      decisions[x.id] = x.recommend;
    }
  }
  document.title = digest.title;
  document.getElementById('title').textContent = digest.title;
  document.getElementById('legend').replaceChildren(...Object.entries(digest.legend ?? {}).map(([k, v]) => el('span', {}, el('code', {}, k), ' = ', el('code', {}, v))));
  document.getElementById('recurring-section').classList.toggle('hidden', !(digest.recurring ?? []).length);
  document.getElementById('scope').addEventListener('change', render);
  document.getElementById('changed').addEventListener('change', render);
  document.getElementById('download').addEventListener('click', download);
  document.getElementById('copy').addEventListener('click', copy);
  render();
})();
</script>
</body>
</html>
